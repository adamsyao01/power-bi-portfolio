<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <rect width="900" height="380" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
    <!-- liens -->
    <g stroke="#23395B" stroke-width="1.6">
      <line x1="200" y1="70" x2="450" y2="70"/>
      <line x1="200" y1="70" x2="450" y2="190"/>
      <line x1="200" y1="190" x2="450" y2="70"/>
      <line x1="200" y1="190" x2="450" y2="190"/>
      <line x1="200" y1="70" x2="450" y2="310"/>
    </g>
    <!-- dimensions -->
    <rect x="40" y="48" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#23395B" stroke-width="1.6"/>
    <text x="120" y="68" fill="#23395B">DimDate</text>
    <text x="120" y="84" font-size="10.5" font-weight="400" fill="#8A8F98">exercice avril → mars</text>
    <rect x="40" y="168" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#23395B" stroke-width="1.6"/>
    <text x="120" y="188" fill="#23395B">DimCompte</text>
    <text x="120" y="204" font-size="10.5" font-weight="400" fill="#8A8F98">compte → catégorie · signe</text>
    <!-- faits -->
    <rect x="450" y="48" width="170" height="44" rx="8" fill="#23395B"/>
    <text x="535" y="75" fill="#FFFFFF">FaitGL (réel)</text>
    <rect x="450" y="168" width="170" height="44" rx="8" fill="#23395B"/>
    <text x="535" y="195" fill="#FFFFFF">FaitBudget</text>
    <rect x="450" y="288" width="170" height="44" rx="8" fill="#23395B"/>
    <text x="535" y="315" fill="#FFFFFF">FaitTresorerie</text>
    <!-- déconnectées -->
    <rect x="690" y="48" width="180" height="70" rx="8" fill="#F4F8F7" stroke="#2A9D8F" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="780" y="74" fill="#2A9D8F">StructurePL</text>
    <text x="780" y="92" font-size="10.5" font-weight="400" fill="#4A4F57">lignes et sous-totaux</text>
    <text x="780" y="106" font-size="10.5" font-weight="400" fill="#4A4F57">de l'état des résultats</text>
    <rect x="690" y="168" width="180" height="70" rx="8" fill="#F4F8F7" stroke="#2A9D8F" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="780" y="194" fill="#2A9D8F">Vue (groupe de calcul)</text>
    <text x="780" y="212" font-size="10.5" font-weight="400" fill="#4A4F57">mois sélectionné</text>
    <text x="780" y="226" font-size="10.5" font-weight="400" fill="#4A4F57">ou cumul de l'exercice</text>
    <!-- légende -->
    <g font-size="11.5" font-weight="400" text-anchor="start" fill="#8A8F98">
      <rect x="40" y="350" width="16" height="12" rx="3" fill="#23395B"/><text x="62" y="360">Table de faits</text>
      <rect x="180" y="350" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#23395B"/><text x="202" y="360">Dimension</text>
      <rect x="300" y="350" width="16" height="12" rx="3" fill="#F4F8F7" stroke="#2A9D8F" stroke-dasharray="3 2"/><text x="322" y="360">Table de paramètres (non reliée)</text>
    </g>
  </g>
</svg>
